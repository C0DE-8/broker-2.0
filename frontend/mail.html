<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Floating Mail Widget -->
<a
  href="mailto:my.sway.market.74globalgain.pw@gmail.com"
  class="mail-float-btn"
  aria-label="Email us"
  title="Email us"
>
  <!-- Mail icon (SVG) -->
  <svg
    width="22"
    height="22"
    viewBox="0 0 24 24"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
  >
    <path
      d="M4 6.5C4 5.67157 4.67157 5 5.5 5H18.5C19.3284 5 20 5.67157 20 6.5V17.5C20 18.3284 19.3284 19 18.5 19H5.5C4.67157 19 4 18.3284 4 17.5V6.5Z"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linejoin="round"
    />
    <path
      d="M6 7.5L12 12L18 7.5"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
</a>

<style>
  .mail-float-btn {
    position: fixed;
    right: 18px;
    bottom: 18px;
    width: 54px;
    height: 54px;
    border-radius: 999px;
    display: grid;
    place-items: center;
    text-decoration: none;

    background: rgba(25, 25, 35, 0.85);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.14);

    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    z-index: 999999;
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  }

  .mail-float-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
    background: rgba(35, 35, 50, 0.9);
  }

  .mail-float-btn:active {
    transform: translateY(0px) scale(0.98);
  }

  /* Mobile safe-area padding (iPhone notch area) */
  @supports (padding: max(0px)) {
    .mail-float-btn {
      bottom: max(18px, env(safe-area-inset-bottom));
      right: max(18px, env(safe-area-inset-right));
    }
  }
</style>
</body>
</html>
